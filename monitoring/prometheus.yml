global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'api'
    static_configs:
      - targets: ['api:8080']

  - job_name: 'ai-agent'
    static_configs:
      - targets: ['ai-agent:9001']

  - job_name: 'worker'
    static_configs:
      - targets: ['worker:9002']

  - job_name: 'ehr-mock'
    static_configs:
      - targets: ['ehr-mock:9000']
